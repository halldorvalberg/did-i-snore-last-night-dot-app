name: did_i_snore
description: "Records you while you sleep, throws away the silence, and shows you a timeline of the noises you actually made. Local-only, no network."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Phase 0 — consent flow + state.
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0

  # Phase 2 — mic capture.
  #
  # `record` ^6.2.0 pulls modern federated platform packages (record_linux
  # ^1.3.0, record_android ^1.5.0, etc.) that all implement
  # record_platform_interface ^1.5.0's `startStream` + updated
  # `hasPermission` signature. Older `record` (5.x) lines pulled
  # record_linux 0.7.2 transitively, which fails to compile against the 1.5.0
  # interface even on Android targets — Flutter's compile phase parses every
  # platform implementation. Pinning record itself to a coherent line is the
  # right fix; no dependency_overrides needed.
  record: ^6.2.0

  # Phase 3 — calibration. Used to derive a stable per-device id for
  # `shared_preferences` keying so calibration survives reinstalls of
  # different app versions on the same hardware.
  device_info_plus: ^10.1.0

  # Phase 4 — spectral pre-filter. Pure-Dart FFT, used inside SpectralProbe
  # to compute snore-band fraction + spectral flatness on the first 960 ms
  # of an event window. Bluestein support means we can use the natural
  # 15360-sample window (= classifierFrameMs at 16 kHz) without padding.
  fftea: ^1.5.0

  # Phase 5 — YAMNet classifier. The bundled int8-quantized YAMNet at
  # assets/models/yamnet.tflite is a TFLite flatbuffer with appended zip
  # metadata (TFL3 magic + PK central-directory at the tail). Interpreter
  # reads only the flatbuffer prefix; the canonical 3-column class map at
  # assets/models/yamnet_class_map.csv is the label source of truth, not
  # the embedded yamnet_label_list.txt.
  tflite_flutter: ^0.12.1

  # Phase 6 — persistence. Drift is the typed SQLite layer for events +
  # recording_gaps; we pair it with `sqlite3_flutter_libs` (NOT
  # `drift_flutter`) because the latter pulls in `sqflite` for its
  # platform-channel fallback, and we want pure native SQLite — no MainOf
  # platform-channel hops on the hot path. `sqlite3_flutter_libs` ships
  # the prebuilt SQLite `.so`/`.dylib` per ABI; on Android 14+ this works
  # out of the box without ANGLE/NDK setup. `NativeDatabase.createInBackground`
  # (from `package:drift/native.dart`) opens against those bundled libs.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # Phase 6 — path resolution. `audioPath` and `peaksPath` columns store
  # paths *relative* to `getApplicationDocumentsDirectory()` because iOS
  # rewrites the sandbox UUID on every TestFlight reinstall — absolute
  # paths persisted in the DB break across reinstalls. `path` joins the
  # docs-dir prefix with the relative key at read time.
  path_provider: ^2.1.4
  path: ^1.9.0

  # Phase 7 — Opus encoding. Path A (ffmpeg fork) per spec §7.1; Path B
  # (libopus FFI) is deferred to Phase 7.5 if battery telemetry warrants.
  #
  # **Why this fork:** the original `ffmpeg_kit_flutter` was archived by
  # arthenica.com in 2024 and is no longer accepting fixes. The maintained
  # successor is `ffmpeg_kit_flutter_new` (publisher antonkarpenko.com),
  # last released 6 months ago, FFmpeg 8.0, 20.6k weekly downloads, 150/160
  # pub points, LGPL-3.0. Active issue tracker, Kotlin 1.8.22+ pin, Android
  # API 24, iOS 14.0 minimums — all within our defaults.
  #
  # **Why the `_audio` sub-package, not the umbrella `_new`:** the umbrella
  # is the full-GPL build (~50 MB AAR/framework) and we don't need video
  # codecs. The `_audio` variant ships libopus alongside lame/libvorbis/
  # speex/etc but drops x264/x265/libvpx entirely — materially smaller
  # download (~25 MB on arm64) for the same `-c:a libopus` capability we
  # need. LGPL-3.0, no GPL codecs, safe for a personal-use app. Default
  # config does not enable network protocols (that's the `_https` family),
  # so our `-i <local_pcm>` invocation can never resolve to a network URL.
  #
  # **Threading:** `FFmpegKit.execute()` returns `Future<FFmpegSession>`;
  # the ffmpeg work runs on a native platform thread, not the Dart event
  # loop. The encode queue can therefore drain serially on the main isolate
  # without stalling the mic hot path. (Spec §7 says "worker isolate" but
  # the example uses `await FFmpegKit.execute` directly — reading "worker
  # isolate" as "off the mic loop", which native ffmpeg already provides.
  # If device telemetry shows mic hiccups during encode, revisit and
  # `Isolate.spawn` the queue's drain loop.)
  #
  # **Platform setup the Phase 1 native FGS will need to verify on device:**
  #   - Android: `build.gradle.kts` Kotlin >= 1.8.22, minSdk >= 24, AAR
  #     auto-resolves through Flutter's gradle plugin. No GPL flag toggle
  #     needed (audio variant is LGPL-only).
  #   - iOS: `Podfile` `platform :ios, '14.0'`. CocoaPods auto-resolves
  #     the framework. No GPL flag toggle needed.
  ffmpeg_kit_flutter_new_audio: ^2.0.0

  # Phase 8 — UI. `just_audio` plays the encoded `.opus` files in the
  # player screen. Opus-in-Ogg is supported out of the box by the
  # platform decoders just_audio wraps (ExoPlayer on Android, AVPlayer
  # on iOS). We never transcode at playback time — the file on disk is
  # the file we stream. `just_audio_background` is intentionally NOT a
  # dep: this is a foreground player only (Phase 9 wakes the recorder
  # via the native FGS, not the player).
  #
  # `intl` is a transitive dep of `flutter_localizations`, but the UI
  # uses `DateFormat.MMMd()` / `DateFormat.Hm()` directly to render
  # timeline date headers and tile timestamps in the device's locale
  # (the only locale-sensitive surface in v1; copy is hardcoded English
  # per spec §8 line 908). Pin explicitly so the import works without
  # adding `flutter_localizations` to keep the bundle lean.
  just_audio: ^0.9.40
  intl: ^0.19.0

  # NOTE: deps for later phases (flutter_background_service, workmanager,
  # flutter_local_notifications) are added per-phase to minimise
  # transitive dependency-resolution conflicts. The full v1 list lives in
  # docs/IMPLEMENTATION.md 0.2; each phase's slash command pulls in what
  # it needs.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Phase 6 — Drift codegen. `drift_dev` reads the table classes in
  # `lib/data/*.dart` and writes the generated `*.g.dart` companions next
  # to them; `build_runner` is the orchestrator. Generated files are
  # committed (not gitignored) so a fresh checkout doesn't have to run
  # codegen before `flutter analyze` works.
  build_runner: ^2.4.9
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

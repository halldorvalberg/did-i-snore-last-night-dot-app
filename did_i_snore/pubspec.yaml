name: did_i_snore
description: "Records you while you sleep, throws away the silence, and shows you a timeline of the noises you actually made. Local-only, no network."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Phase 0 — consent flow + state.
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.0

  # Phase 2 — mic capture.
  #
  # `record` ^6.2.0 pulls modern federated platform packages (record_linux
  # ^1.3.0, record_android ^1.5.0, etc.) that all implement
  # record_platform_interface ^1.5.0's `startStream` + updated
  # `hasPermission` signature. Older `record` (5.x) lines pulled
  # record_linux 0.7.2 transitively, which fails to compile against the 1.5.0
  # interface even on Android targets — Flutter's compile phase parses every
  # platform implementation. Pinning record itself to a coherent line is the
  # right fix; no dependency_overrides needed.
  record: ^6.2.0

  # Phase 3 — calibration. Used to derive a stable per-device id for
  # `shared_preferences` keying so calibration survives reinstalls of
  # different app versions on the same hardware.
  device_info_plus: ^10.1.0

  # Phase 4 — spectral pre-filter. Pure-Dart FFT, used inside SpectralProbe
  # to compute snore-band fraction + spectral flatness on the first 960 ms
  # of an event window. Bluestein support means we can use the natural
  # 15360-sample window (= classifierFrameMs at 16 kHz) without padding.
  fftea: ^1.5.0

  # Phase 5 — YAMNet classifier. The bundled int8-quantized YAMNet at
  # assets/models/yamnet.tflite is a TFLite flatbuffer with appended zip
  # metadata (TFL3 magic + PK central-directory at the tail). Interpreter
  # reads only the flatbuffer prefix; the canonical 3-column class map at
  # assets/models/yamnet_class_map.csv is the label source of truth, not
  # the embedded yamnet_label_list.txt.
  tflite_flutter: ^0.12.1

  # Phase 6 — persistence. Drift is the typed SQLite layer for events +
  # recording_gaps; we pair it with `sqlite3_flutter_libs` (NOT
  # `drift_flutter`) because the latter pulls in `sqflite` for its
  # platform-channel fallback, and we want pure native SQLite — no MainOf
  # platform-channel hops on the hot path. `sqlite3_flutter_libs` ships
  # the prebuilt SQLite `.so`/`.dylib` per ABI; on Android 14+ this works
  # out of the box without ANGLE/NDK setup. `NativeDatabase.createInBackground`
  # (from `package:drift/native.dart`) opens against those bundled libs.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # Phase 6 — path resolution. `audioPath` and `peaksPath` columns store
  # paths *relative* to `getApplicationDocumentsDirectory()` because iOS
  # rewrites the sandbox UUID on every TestFlight reinstall — absolute
  # paths persisted in the DB break across reinstalls. `path` joins the
  # docs-dir prefix with the relative key at read time.
  path_provider: ^2.1.4
  path: ^1.9.0

  # NOTE: deps for later phases (flutter_background_service, workmanager,
  # flutter_local_notifications) are added per-phase to minimise
  # transitive dependency-resolution conflicts. The full v1 list lives in
  # docs/IMPLEMENTATION.md 0.2; each phase's slash command pulls in what
  # it needs.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Phase 6 — Drift codegen. `drift_dev` reads the table classes in
  # `lib/data/*.dart` and writes the generated `*.g.dart` companions next
  # to them; `build_runner` is the orchestrator. Generated files are
  # committed (not gitignored) so a fresh checkout doesn't have to run
  # codegen before `flutter analyze` works.
  build_runner: ^2.4.9
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

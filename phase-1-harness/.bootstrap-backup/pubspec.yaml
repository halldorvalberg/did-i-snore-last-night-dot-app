# THROWAWAY HARNESS - Phase 2 will rebuild this properly.
# Versions pinned to recent stable per docs/IMPLEMENTATION.md 0.2.

name: phase_1_harness
description: Background-survival smoke test for did-i-snore-last-night.app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # ^6.x has coherent transitive deps (record_linux 1.3+ implements
  # record_platform_interface 1.5+); the 5.x line pulled record_linux 0.7.2
  # which fails to compile against the 1.5.0 interface even on Android.
  # Same fix as the main project at did_i_snore/.
  record: ^6.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.1.2
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
